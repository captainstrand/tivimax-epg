name: Update worldwide EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download worldwide XMLTV guide
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 \
            -o guide.xml.gz.tmp \
            'https://epg.pw/xmltv/epg.xml.gz'
          gzip -t guide.xml.gz.tmp
          mv guide.xml.gz.tmp guide.xml.gz

      - name: Commit refreshed guide
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.xml.gz
          if git diff --cached --quiet; then
            echo 'Guide unchanged.'
          else
            git commit -m 'Refresh worldwide XMLTV guide'
            git push
          fi
