name: Update worldwide EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG and matching databases
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -o epgpw.xml.gz 'https://epg.pw/xmltv/epg.xml.gz'
          gzip -t epgpw.xml.gz && gunzip -c epgpw.xml.gz > epgpw.xml
          if curl --fail --location --retry 3 -o epgshare.xml.gz 'https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz'; then
            gzip -t epgshare.xml.gz && gunzip -c epgshare.xml.gz > epgshare.xml
          fi
          curl --fail --location --retry 3 -o channels.json 'https://iptv-org.github.io/api/channels.json'
          curl --fail --location --retry 3 -o feeds.json 'https://iptv-org.github.io/api/feeds.json'
          curl --fail --location --retry 3 -o guides.json 'https://iptv-org.github.io/api/guides.json'

      - name: Merge programme window and country-aware aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,json,unicodedata,difflib
          import xml.etree.ElementTree as ET
          from datetime import datetime,timezone,timedelta
          now=datetime.now(timezone.utc); low=now-timedelta(days=1); high=now+timedelta(days=7)
          inputs=[x for x in ('epgpw.xml','epgshare.xml') if os.path.exists(x)]
          channels={}; channel_names={}; programmes={}; used=set()
          def dt(s):
              m=re.match(r'(\d{14})\s*([+-]\d{4})?',s or '')
              if not m:return None
              x=datetime.strptime(m.group(1),'%Y%m%d%H%M%S'); o=m.group(2)
              if not o:return x.replace(tzinfo=timezone.utc)
              sign=1 if o[0]=='+' else -1
              d=timedelta(hours=int(o[1:3]),minutes=int(o[3:5]))*sign
              return x.replace(tzinfo=timezone(d)).astimezone(timezone.utc)
          def norm(s):
              s=unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
              s=re.sub(r'^(?:uk|us|usa|ca|canada|au|nz|ie|fr|de|es|it|pt|nl|be|se|no|dk|fi|pl|gr|in|za)\s*[:|\-]\s*','',s)
              s=s.replace('&',' and ')
              s=re.sub(r'\b(hdtv|hd|fhd|uhd|4k|1080p|720p|channel|network|tv)\b',' ',s)
              return re.sub(r'[^a-z0-9]+','',s)
          def id_country(cid):
              base=(cid or '').split('@',1)[0]
              m=re.search(r'\.([A-Za-z]{2})(?:\d+)?$',base)
              return m.group(1).upper() if m else None
          for fn in inputs:
              print('Reading',fn)
              for _,e in ET.iterparse(fn,events=('end',)):
                  tag=e.tag.rsplit('}',1)[-1]
                  if tag=='channel':
                      cid=e.get('id')
                      if cid and cid not in channels:
                          channels[cid]=ET.tostring(e,encoding='unicode')
                          channel_names[cid]=[x.text or '' for x in e.findall('./display-name')]
                  elif tag=='programme':
                      cid=e.get('channel'); start=e.get('start',''); stop=e.get('stop',''); when=dt(start)
                      if cid and when and low<=when<=high:
                          k=(cid,start,stop)
                          if k not in programmes: programmes[k]=ET.tostring(e,encoding='unicode'); used.add(cid)
                  e.clear()

          canon=json.load(open('channels.json',encoding='utf-8')); feeds=json.load(open('feeds.json',encoding='utf-8')); guides=json.load(open('guides.json',encoding='utf-8'))
          canon_by_id={c.get('id'):c for c in canon if c.get('id')}
          canonical_country={cid:(c.get('country') or '').upper() or id_country(cid) for cid,c in canon_by_id.items()}
          alias_of={}; existing=set(channels); active_lower={}; name_index={}; source_norms={}
          for cid in used:
              active_lower.setdefault(cid.lower(),[]).append(cid)
              vals=[cid]+channel_names.get(cid,[])
              source_norms[cid]=set(filter(None,(norm(v) for v in vals)))
              for n in source_norms[cid]:name_index.setdefault(n,set()).add(cid)
          def add(alias,target):
              if not alias or alias in used or alias in existing or alias in alias_of:return False
              hits=[target] if target in used else active_lower.get((target or '').lower(),[])
              if len(hits)==1:alias_of[alias]=hits[0];return True
              return False
          case_hits=0
          for cid in used:
              aid=cid.lower()
              if aid!=cid and aid not in existing and aid not in alias_of:alias_of[aid]=cid;case_hits+=1
          canonical_hits=0
          for c in canon:
              cid=c.get('id')
              if cid and add(cid,cid):canonical_hits+=1
          guide_hits=0;seen=set()
          for g in guides:
              base=g.get('channel');feed=g.get('feed')
              if not base:continue
              for gid in [base]+([base+'@'+feed] if feed else []):
                  if gid in seen:continue
                  seen.add(gid)
                  for t in (gid,base):
                      if add(gid,t):guide_hits+=1;break
          feed_hits=0
          for f in feeds:
              base=f.get('channel');fid=f.get('id')
              if not base or not fid:continue
              gid=base+'@'+fid
              for t in (gid,base):
                  if add(gid,t):feed_hits+=1;break

          provider=json.load(open('provider_aliases.json',encoding='utf-8')) if os.path.exists('provider_aliases.json') else {}
          provider_hits=0;direct_hits=0;name_hits=0;country_rejects=0;provider_missing=[]
          for pid,target in provider.items():
              resolved=None;method=None
              expected=canonical_country.get(target) or id_country(target) or id_country(pid)
              direct=[]
              if target in used:direct=[target]
              elif len(active_lower.get(target.lower(),[]))==1:direct=active_lower[target.lower()]
              elif target in alias_of:direct=[alias_of[target]]
              if direct:
                  cand=direct[0]; got=id_country(cand)
                  if not expected or not got or expected==got:resolved=cand;method='direct'
                  else:country_rejects+=1
              if not resolved:
                  c=canon_by_id.get(target,{})
                  candidates=[target,c.get('name','')]+(c.get('alt_names') or [])
                  hits=set()
                  for candidate in candidates:
                      n=norm(candidate)
                      if not n:continue
                      for h in name_index.get(n,set()):
                          got=id_country(h)
                          if expected and got and expected!=got:country_rejects+=1;continue
                          if expected and not got:continue
                          hits.add(h)
                  if len(hits)==1:resolved=next(iter(hits));method='name'
              if resolved and pid not in used:
                  alias_of[pid]=resolved;provider_hits+=1
                  if method=='name':name_hits+=1
                  else:direct_hits+=1
              else:provider_missing.append((pid,target,expected))

          # ADDITIVE playlist-aware matching. It never replaces an existing/source/provider alias.
          playlist=json.load(open('provider_channels.json',encoding='utf-8')) if os.path.exists('provider_channels.json') else []
          playlist_exact=0; playlist_fuzzy=0; playlist_ambiguous=0; playlist_unmatched=0; playlist_existing=0
          country_buckets={}
          for cid in used:
              country_buckets.setdefault(id_country(cid),[]).append(cid)
          for row in playlist:
              pid=(row.get('id') or '').strip(); pname=(row.get('name') or '').strip()
              if not pid:continue
              if pid in used or pid in existing or pid in alias_of:
                  playlist_existing+=1;continue
              expected=id_country(pid); pn=norm(pname)
              if not pn:
                  playlist_unmatched+=1;continue
              pool=country_buckets.get(expected,[]) if expected else list(used)
              # Country is a hard guardrail whenever provider ID supplies one.
              exact=set()
              for h in name_index.get(pn,set()):
                  got=id_country(h)
                  if expected and got!=expected:continue
                  exact.add(h)
              if len(exact)==1:
                  alias_of[pid]=next(iter(exact));playlist_exact+=1;continue
              if len(exact)>1:
                  playlist_ambiguous+=1;continue
              # Conservative fuzzy comparison. Require very high similarity and a clear
              # gap from runner-up so common/local station names are not guessed.
              scored=[]
              for h in pool:
                  best=0.0
                  for sn in source_norms.get(h,()):
                      if not sn:continue
                      r=difflib.SequenceMatcher(None,pn,sn).ratio()
                      if r>best:best=r
                  if best>=0.90:scored.append((best,h))
              scored.sort(reverse=True)
              if scored and scored[0][0]>=0.94 and (len(scored)==1 or scored[0][0]-scored[1][0]>=0.06):
                  alias_of[pid]=scored[0][1];playlist_fuzzy+=1
              elif scored:
                  playlist_ambiguous+=1
              else:
                  playlist_unmatched+=1

          print(f'Case aliases: {case_hits:,}; canonical: {canonical_hits:,}; guide/feed: {guide_hits+feed_hits:,}')
          print(f'Provider mappings: {len(provider):,}; applied: {provider_hits:,} (direct {direct_hits:,}, country-safe name {name_hits:,}); unresolved: {len(provider_missing):,}; wrong-country candidates rejected: {country_rejects:,}')
          print(f'Playlist channels: {len(playlist):,}; already covered: {playlist_existing:,}; exact-name added: {playlist_exact:,}; high-confidence fuzzy added: {playlist_fuzzy:,}; ambiguous held back: {playlist_ambiguous:,}; unmatched: {playlist_unmatched:,}')
          print(f'Total aliases: {len(alias_of):,}')
          with open('guide.xml','w',encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv generator-info-name="CaptainStrand TiviMax Multi-Source EPG">\n')
              for cid in sorted(used):
                  if cid in channels:f.write(channels[cid]+'\n')
              for aid,src in sorted(alias_of.items()):
                  if src in channels:
                      e=ET.fromstring(channels[src]);e.set('id',aid);f.write(ET.tostring(e,encoding='unicode')+'\n')
              for k in sorted(programmes,key=lambda x:(x[1],x[0] or '')):f.write(programmes[k]+'\n')
              bysrc={}
              for a,s in alias_of.items():bysrc.setdefault(s,[]).append(a)
              for k in sorted(programmes,key=lambda x:(x[1],x[0] or '')):
                  for aid in bysrc.get(k[0],[]):
                      e=ET.fromstring(programmes[k]);e.set('channel',aid);f.write(ET.tostring(e,encoding='unicode')+'\n')
              f.write('</tv>\n')
          print(f'Sources: {len(inputs)}; active channels: {len(used):,}; programmes: {len(programmes):,}; aliases: {len(alias_of):,}')
          PY
          gzip -9 -c guide.xml > guide.xml.gz
          gzip -t guide.xml.gz
          ls -lh guide.xml.gz
          rm -f guide.xml epgpw.xml epgpw.xml.gz epgshare.xml epgshare.xml.gz channels.json feeds.json guides.json

      - name: Commit refreshed guide
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c%s guide.xml.gz)
          if [ "$size" -ge 100000000 ]; then echo "guide.xml.gz too large: $size bytes"; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.xml.gz
          if git diff --cached --quiet; then echo 'Guide unchanged.'; else git commit -m 'Refresh playlist-aware worldwide XMLTV guide'; git push; fi
