name: Build TiviMax EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: tivimax-epg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download current playlist and EPG sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -o playlist.m3u 'https://files.catbox.moe/w82282.m3u'
          curl --fail --location --retry 4 -o epgpw.xml.gz 'https://epg.pw/xmltv/epg.xml.gz'
          gzip -t epgpw.xml.gz
          gunzip -c epgpw.xml.gz > epgpw.xml
          if curl --fail --location --retry 3 -o epgshare.xml.gz 'https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz'; then
            gzip -t epgshare.xml.gz
            gunzip -c epgshare.xml.gz > epgshare.xml
          fi

      - name: Build playlist-specific XMLTV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,html,unicodedata,difflib,gzip,os
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime,timezone,timedelta

          def norm(s):
              s=html.unescape(s or '')
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              s=re.sub(r'^\s*(?:uk|gb|us|usa|ca|au|nz|ie)\s*[:|\-]\s*','',s)
              s=re.sub(r'\s*\((?:d|s|e|w|east|west|hd|fhd|uhd|4k)\)\s*$','',s)
              s=re.sub(r'\b(?:fhd|uhd|4k|1080p|720p)\b',' ',s)
              return re.sub(r'[^a-z0-9]+','',s)

          def country(pid,name):
              m=re.search(r'\.([A-Za-z]{2})(?:\d+)?$',pid or '')
              if m:
                  c=m.group(1).upper()
                  return 'GB' if c=='UK' else c
              m=re.match(r'^\s*(UK|GB|US|USA|CA|AU|NZ|IE)\s*:',html.unescape(name or ''),re.I)
              if m:
                  return {'UK':'GB','USA':'US'}.get(m.group(1).upper(),m.group(1).upper())
              return ''

          attrs=re.compile(r'([\w-]+)="([^"]*)"')
          playlist=[]
          pending=None
          with open('playlist.m3u',encoding='utf-8-sig',errors='replace') as fh:
              for raw in fh:
                  line=raw.strip()
                  if line.startswith('#EXTINF:'):
                      a=dict(attrs.findall(line))
                      name=html.unescape(line.rsplit(',',1)[-1].strip())
                      pending={'id':html.unescape(a.get('tvg-id','')).strip(),'name':name,
                               'group':html.unescape(a.get('group-title','')).strip()}
                  elif line and not line.startswith('#') and pending:
                      pending['url']=line
                      playlist.append(pending); pending=None

          # Deduplicate identical playlist entries without losing name-only channels.
          seen=set(); pl=[]
          for p in playlist:
              k=(p['id'].lower(),p['name'].lower(),p['group'].lower())
              if k not in seen:
                  seen.add(k); pl.append(p)
          playlist=pl

          aliases={}
          try:
              with open('provider_aliases.json',encoding='utf-8') as f: aliases=json.load(f)
          except Exception: pass
          alias_ci={str(k).lower():str(v) for k,v in aliases.items()}

          sources=[x for x in ('epgpw.xml','epgshare.xml') if os.path.exists(x)]
          src={}
          by_id_ci={}
          name_index=defaultdict(set)

          # First pass: channel metadata only.
          for path in sources:
              for ev,e in ET.iterparse(path,events=('end',)):
                  if e.tag!='channel':
                      e.clear(); continue
                  sid=e.get('id','').strip()
                  if not sid: e.clear(); continue
                  names=[(n.text or '').strip() for n in e.findall('display-name') if (n.text or '').strip()]
                  if sid not in src: src[sid]={'names':names,'path':path}
                  by_id_ci.setdefault(sid.lower(),sid)
                  for n in names:
                      z=norm(n)
                      if z: name_index[z].add(sid)
                  e.clear()

          def choose(p):
              pid=p['id']; nm=p['name']; c=country(pid,nm)
              # Strongest: exact/case-insensitive XMLTV id.
              if pid:
                  if pid in src: return pid,'id-exact'
                  if pid.lower() in by_id_ci: return by_id_ci[pid.lower()],'id-case'
                  a=alias_ci.get(pid.lower())
                  if a:
                      if a in src:return a,'manual-alias'
                      if a.lower() in by_id_ci:return by_id_ci[a.lower()],'manual-alias-case'
              z=norm(nm)
              if not z:return None,'unmatched'
              candidates=list(name_index.get(z,()))
              if candidates:
                  same=[x for x in candidates if not c or country(x,'')==c]
                  q=same or candidates
                  if len(q)==1:return q[0],'name-exact'
              # Conservative fuzzy match, country-aware where possible.
              pool=[]
              for key,ids in name_index.items():
                  if abs(len(key)-len(z))>max(5,len(z)//3):continue
                  ratio=difflib.SequenceMatcher(None,z,key).ratio()
                  if ratio<0.92:continue
                  for sid in ids:
                      if c and country(sid,'') not in ('',c):continue
                      pool.append((ratio,sid))
              pool.sort(reverse=True)
              if pool and (len(pool)==1 or pool[0][0]-pool[1][0]>=0.04):
                  return pool[0][1],'name-fuzzy'
              return None,'ambiguous' if pool else 'unmatched'

          matches=[]; counts=defaultdict(int)
          for p in playlist:
              sid,why=choose(p); counts[why]+=1
              if sid: matches.append((p,sid,why))

          wanted={sid for _,sid,_ in matches}
          programmes=defaultdict(list)
          now=datetime.now(timezone.utc); lo=now-timedelta(hours=12); hi=now+timedelta(days=7)
          def dt(s):
              m=re.match(r'(\d{14})\s*([+-]\d{4})?',s or '')
              if not m:return None
              d=datetime.strptime(m.group(1),'%Y%m%d%H%M%S')
              if not m.group(2):return d.replace(tzinfo=timezone.utc)
              z=m.group(2); sign=1 if z[0]=='+' else -1
              off=timedelta(hours=int(z[1:3]),minutes=int(z[3:5]))*sign
              return d.replace(tzinfo=timezone(off)).astimezone(timezone.utc)

          # Second pass: retain programmes only for matched source IDs.
          for path in sources:
              for ev,e in ET.iterparse(path,events=('end',)):
                  if e.tag!='programme':
                      e.clear(); continue
                  sid=e.get('channel','')
                  if sid in wanted:
                      st=dt(e.get('start'))
                      if st and lo<=st<=hi:
                          programmes[sid].append(ET.tostring(e,encoding='unicode'))
                  e.clear()

          root=ET.Element('tv',{'generator-info-name':'TiviMax playlist-specific EPG'})
          out_ids=set(); output=[]
          # Prefer tvg-id as XMLTV id; for blank ids retain source id and playlist display name.
          for p,sid,why in matches:
              if not programmes.get(sid):continue
              oid=p['id'].strip() or sid
              key=(oid,sid)
              if key in out_ids:continue
              out_ids.add(key); output.append((p,sid,oid,why))
              ch=ET.SubElement(root,'channel',{'id':oid})
              ET.SubElement(ch,'display-name').text=p['name']
              for n in src.get(sid,{}).get('names',[])[:2]:
                  if norm(n)!=norm(p['name']): ET.SubElement(ch,'display-name').text=n

          # Duplicate only the schedules actually needed by playlist aliases.
          for p,sid,oid,why in output:
              for raw in programmes[sid]:
                  e=ET.fromstring(raw); e.set('channel',oid); root.append(e)

          ET.ElementTree(root).write('guide.xml',encoding='utf-8',xml_declaration=True)
          ET.parse('guide.xml')
          with open('guide.xml','rb') as a,gzip.open('guide.xml.gz','wb',compresslevel=9) as b:
              while True:
                  x=a.read(1024*1024)
                  if not x:break
                  b.write(x)

          size=os.path.getsize('guide.xml.gz')
          if size>10*1024*1024:
              raise SystemExit(f'Refusing to publish oversized guide: {size/1048576:.2f} MB')

          report={
            'playlist_entries':len(playlist),
            'entries_with_tvg_id':sum(bool(p['id']) for p in playlist),
            'unique_tvg_ids':len({p['id'].lower() for p in playlist if p['id']}),
            'source_channels':len(src),
            'matched_entries':len(matches),
            'published_channels':len(output),
            'matched_source_ids_with_programmes':len({sid for _,sid,_,_ in output}),
            'match_methods':dict(sorted(counts.items())),
            'compressed_bytes':size,
            'unmatched_examples':[{'id':p['id'],'name':p['name'],'group':p['group']} for p in playlist if choose(p)[0] is None][:500]
          }
          with open('match-report.json','w',encoding='utf-8') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,indent=2))
          PY
          gzip -t guide.xml.gz

      - name: Publish validated guide and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tivimax-epg-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add guide.xml.gz match-report.json
          if git diff --cached --quiet; then
            echo 'No EPG changes to publish.'
            exit 0
          fi
          git commit -m "Update playlist-specific TiviMax EPG"
          git push
