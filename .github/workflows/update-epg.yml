name: Update worldwide EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download EPG and channel databases
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 -o epgpw.xml.gz 'https://epg.pw/xmltv/epg.xml.gz'
          gzip -t epgpw.xml.gz && gunzip -c epgpw.xml.gz > epgpw.xml
          if curl --fail --location --retry 3 -o epgshare.xml.gz 'https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz'; then
            gzip -t epgshare.xml.gz && gunzip -c epgshare.xml.gz > epgshare.xml
          fi
          curl --fail --location --retry 3 -o channels.json 'https://iptv-org.github.io/api/channels.json'

      - name: Merge programme window and provider-targeted aliases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,json
          import xml.etree.ElementTree as ET
          from datetime import datetime,timezone,timedelta
          now=datetime.now(timezone.utc); low=now-timedelta(days=1); high=now+timedelta(days=7)
          inputs=[x for x in ('epgpw.xml','epgshare.xml') if os.path.exists(x)]
          channels={}; programmes={}; used=set()
          def dt(s):
              m=re.match(r'(\d{14})\s*([+-]\d{4})?',s or '')
              if not m:return None
              x=datetime.strptime(m.group(1),'%Y%m%d%H%M%S'); o=m.group(2)
              if not o:return x.replace(tzinfo=timezone.utc)
              sign=1 if o[0]=='+' else -1
              d=timedelta(hours=int(o[1:3]),minutes=int(o[3:5]))*sign
              return x.replace(tzinfo=timezone(d)).astimezone(timezone.utc)
          for fn in inputs:
              print('Reading',fn)
              for _,e in ET.iterparse(fn,events=('end',)):
                  tag=e.tag.rsplit('}',1)[-1]
                  if tag=='channel':
                      cid=e.get('id')
                      if cid and cid not in channels: channels[cid]=ET.tostring(e,encoding='unicode')
                  elif tag=='programme':
                      cid=e.get('channel'); start=e.get('start',''); stop=e.get('stop',''); when=dt(start)
                      if cid and when and low<=when<=high:
                          k=(cid,start,stop)
                          if k not in programmes:
                              programmes[k]=ET.tostring(e,encoding='unicode'); used.add(cid)
                  e.clear()

          alias_of={}; existing=set(channels)
          # Safe case aliases.
          for cid in used:
              aid=cid.lower()
              if aid!=cid and aid not in existing: alias_of.setdefault(aid,cid)

          # Canonical database aliases, refreshed every build.
          canon=json.load(open('channels.json',encoding='utf-8'))
          active_lower={}
          for cid in used: active_lower.setdefault(cid.lower(),[]).append(cid)
          canonical_hits=0
          for c in canon:
              cid=c.get('id')
              if not cid or cid in used or cid in alias_of: continue
              hits=active_lower.get(cid.lower(),[])
              if len(hits)==1:
                  alias_of[cid]=hits[0]; canonical_hits+=1

          # Provider-specific mappings derived from the user's TiviMax playlist.
          provider=json.load(open('provider_aliases.json',encoding='utf-8')) if os.path.exists('provider_aliases.json') else {}
          provider_hits=0; provider_missing=0
          for provider_id,target in provider.items():
              candidates=[]
              if target in used: candidates=[target]
              elif target.lower() in active_lower: candidates=active_lower[target.lower()]
              if len(candidates)==1 and provider_id not in used:
                  alias_of[provider_id]=candidates[0]; provider_hits+=1
              else: provider_missing+=1

          print(f'Provider mappings loaded: {len(provider):,}; applied: {provider_hits:,}; target missing/ambiguous: {provider_missing:,}')
          print(f'Canonical exact-ID aliases: {canonical_hits:,}; total aliases: {len(alias_of):,}')

          with open('guide.xml','w',encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv generator-info-name="CaptainStrand TiviMax Multi-Source EPG">\n')
              for cid in sorted(used):
                  if cid in channels:f.write(channels[cid]+'\n')
              for aid,src in sorted(alias_of.items()):
                  if src in channels:
                      e=ET.fromstring(channels[src]); e.set('id',aid); f.write(ET.tostring(e,encoding='unicode')+'\n')
              for k in sorted(programmes,key=lambda x:(x[1],x[0] or '')): f.write(programmes[k]+'\n')
              bysrc={}
              for a,s in alias_of.items(): bysrc.setdefault(s,[]).append(a)
              for k in sorted(programmes,key=lambda x:(x[1],x[0] or '')):
                  for aid in bysrc.get(k[0],[]):
                      e=ET.fromstring(programmes[k]); e.set('channel',aid); f.write(ET.tostring(e,encoding='unicode')+'\n')
              f.write('</tv>\n')
          print(f'Sources: {len(inputs)}; active channels: {len(used):,}; programmes: {len(programmes):,}; aliases: {len(alias_of):,}')
          PY
          gzip -9 -c guide.xml > guide.xml.gz
          gzip -t guide.xml.gz
          ls -lh guide.xml.gz
          rm -f guide.xml epgpw.xml epgpw.xml.gz epgshare.xml epgshare.xml.gz channels.json

      - name: Commit refreshed guide
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c%s guide.xml.gz)
          if [ "$size" -ge 100000000 ]; then echo "guide.xml.gz too large: $size bytes"; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.xml.gz
          if git diff --cached --quiet; then
            echo 'Guide unchanged.'
          else
            git commit -m 'Refresh worldwide XMLTV guide with provider mappings'
            git push
          fi
