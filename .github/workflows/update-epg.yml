name: Update worldwide EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download worldwide XMLTV sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 -o epgpw.xml.gz 'https://epg.pw/xmltv/epg.xml.gz'
          gzip -t epgpw.xml.gz
          gunzip -c epgpw.xml.gz > epgpw.xml
          if curl --fail --location --retry 3 --retry-delay 10 -o epgshare.xml.gz 'https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz'; then
            gzip -t epgshare.xml.gz
            gunzip -c epgshare.xml.gz > epgshare.xml
          else
            echo 'EPGShare unavailable; continuing with EPG.pw.'
            rm -f epgshare.xml.gz
          fi

      - name: Merge current programme window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          # Keep a practical TiviMax window instead of publishing a 2.3 GB archive:
          # yesterday through 7 days ahead. This retains current/near-future TV data
          # from every channel present in either source while staying hostable.
          now = datetime.now(timezone.utc)
          low = now - timedelta(days=1)
          high = now + timedelta(days=7)
          inputs = [x for x in ('epgpw.xml','epgshare.xml') if os.path.exists(x)]
          channels = {}
          programmes = {}
          used = set()

          def parse_xmltv(s):
              if not s: return None
              m = re.match(r'(\d{14})\s*([+-]\d{4})?', s)
              if not m: return None
              dt = datetime.strptime(m.group(1), '%Y%m%d%H%M%S')
              off = m.group(2)
              if off:
                  sign = 1 if off[0] == '+' else -1
                  delta = timedelta(hours=int(off[1:3]), minutes=int(off[3:5])) * sign
                  return dt.replace(tzinfo=timezone(delta)).astimezone(timezone.utc)
              return dt.replace(tzinfo=timezone.utc)

          for fn in inputs:
              print('Reading', fn)
              for event, elem in ET.iterparse(fn, events=('end',)):
                  tag = elem.tag.rsplit('}',1)[-1]
                  if tag == 'channel':
                      cid = elem.get('id')
                      if cid and cid not in channels:
                          channels[cid] = ET.tostring(elem, encoding='unicode')
                  elif tag == 'programme':
                      cid = elem.get('channel')
                      start = elem.get('start','')
                      stop = elem.get('stop','')
                      when = parse_xmltv(start)
                      if cid and when and low <= when <= high:
                          key = (cid,start,stop)
                          if key not in programmes:
                              programmes[key] = ET.tostring(elem, encoding='unicode')
                              used.add(cid)
                  elem.clear()

          with open('guide.xml','w',encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<tv generator-info-name="CaptainStrand TiviMax Multi-Source EPG">\n')
              for cid in sorted(used):
                  if cid in channels: f.write(channels[cid]+'\n')
              for key in sorted(programmes, key=lambda k:(k[1],k[0] or '')):
                  f.write(programmes[key]+'\n')
              f.write('</tv>\n')
          print(f'Sources: {len(inputs)}; active channels: {len(used):,}; programmes in 8-day window: {len(programmes):,}')
          PY
          gzip -9 -c guide.xml > guide.xml.gz
          gzip -t guide.xml.gz
          ls -lh guide.xml.gz
          rm -f guide.xml epgpw.xml epgpw.xml.gz epgshare.xml epgshare.xml.gz

      - name: Commit refreshed guide
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c%s guide.xml.gz)
          if [ "$size" -ge 100000000 ]; then
            echo "guide.xml.gz is still too large for GitHub: $size bytes"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guide.xml.gz
          if git diff --cached --quiet; then
            echo 'Guide unchanged.'
          else
            git commit -m 'Refresh compact multi-source worldwide XMLTV guide'
            git push
          fi
